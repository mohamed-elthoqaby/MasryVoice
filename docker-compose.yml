services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: masryvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masryvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masryvoice_dev_password}
      POSTGRES_DB: masryvoice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masryvoice -d masryvoice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  asterisk:
    build:
      context: ./deploy/asterisk
      dockerfile: Dockerfile
    container_name: masryvoice-asterisk
    restart: unless-stopped
    profiles:
      - telephony
    ports:
      - "5060:5060/udp"
      - "10000-10050:10000-10050/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
