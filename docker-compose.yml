services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: masryvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masryvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masryvoice_dev_password}
      POSTGRES_DB: masryvoice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masryvoice -d masryvoice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
