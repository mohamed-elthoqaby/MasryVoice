; ====================================================================
; MasryVoice Asterisk PJSIP Configuration
; Inbound SIP Trunk / VoIP Gateway Configuration for Egyptian Clinic
; ====================================================================

[global]
type=global
user_agent=MasryVoice-Asterisk-20

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Registration with Inbound SIP Trunk Provider (e.g. Telecom Egypt, Zadarma, Twilio)
[masryvoice-reg]
type=registration
outbound_auth=masryvoice-auth
server_uri=sip:sip.provider.com:5060
client_uri=sip:CLINIC_SIP_USER@sip.provider.com:5060
retry_interval=30
forbidden_retry_interval=300
expiration=3600

[masryvoice-auth]
type=auth
auth_type=userpass
username=CLINIC_SIP_USER
password=CLINIC_SIP_PASSWORD

[masryvoice-endpoint]
type=endpoint
context=masryvoice-inbound
disallow=all
allow=alaw,ulaw,g722
aors=masryvoice-aor
auth=masryvoice-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[masryvoice-aor]
type=aor
contact=sip:sip.provider.com:5060
max_contacts=5
qualify_frequency=60
