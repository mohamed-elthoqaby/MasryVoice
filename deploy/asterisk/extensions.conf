; ====================================================================
; MasryVoice Asterisk Dialplan (extensions.conf)
; Routes Inbound PSTN/Mobile Callers to AudioSocket TCP (port 9092)
; ====================================================================

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[masryvoice-inbound]
; Route incoming call on clinic telephone number (e.g., Cairo 02-33445566 or mobile)
exten => _.,1,NoOp(--- MasryVoice Inbound Call from ${CALLERID(num)} on Channel ${CHANNEL(name)} ---)
 same => n,Answer()
 same => n,Wait(1)
 ; AudioSocket connects to MasryVoice Backend on port 9092
 ; Parameters: AudioSocket(UUID,HOST:PORT)
 same => n,Set(AUDIOSOCKET_UUID=${CHANNEL(uniqueid)})
 same => n,NoOp(Connecting AudioSocket with UUID: ${AUDIOSOCKET_UUID})
 same => n,AudioSocket(${AUDIOSOCKET_UUID},backend:9092)
 same => n,NoOp(AudioSocket disconnected. Hanging up channel.)
 same => n,Hangup()

; Fallback / Error Handler
exten => h,1,NoOp(Call Hangup for ${CHANNEL(uniqueid)})
