name: MasryVoice CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build-test:
    name: Backend Build & Deterministic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend & Tests
        run: |
          dotnet restore backend/MasryVoice.Api/MasryVoice.Api.csproj
          dotnet restore tests/MasryVoice.Tests/MasryVoice.Tests.csproj

      - name: Build Solution (Release)
        run: |
          dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-restore
          dotnet build tests/MasryVoice.Tests/MasryVoice.Tests.csproj -c Release --no-restore

      - name: Run Deterministic Domain & Rule Tests
        run: |
          dotnet test tests/MasryVoice.Tests/MasryVoice.Tests.csproj \
            -c Release --no-build \
            --filter "Category!=ExternalModel&Category!=PostgresIntegration" \
            --logger "console;verbosity=normal"

  postgres-integration-test:
    name: PostgreSQL & pgvector Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masryvoice
          POSTGRES_PASSWORD: masryvoice_ci_pass
          POSTGRES_DB: masryvoice_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masryvoice -d masryvoice_ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build Tests
        run: |
          dotnet restore tests/MasryVoice.Tests/MasryVoice.Tests.csproj
          dotnet build tests/MasryVoice.Tests/MasryVoice.Tests.csproj -c Release

      - name: Run PostgreSQL Capacity & Concurrency Integration Tests
        env:
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_ci_db;Username=masryvoice;Password=masryvoice_ci_pass"
        run: |
          dotnet test tests/MasryVoice.Tests/MasryVoice.Tests.csproj \
            -c Release --no-build \
            --filter "Category=PostgresIntegration" \
            --logger "console;verbosity=normal"

  api-acceptance-test:
    name: Postman CLI API Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masryvoice
          POSTGRES_PASSWORD: masryvoice_ci_pass
          POSTGRES_DB: masryvoice_acceptance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masryvoice -d masryvoice_acceptance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
          postman --version

      - name: Build Backend API (Release)
        run: |
          dotnet restore backend/MasryVoice.Api/MasryVoice.Api.csproj
          dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-restore

      - name: Start MasryVoice API in Background
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_acceptance_db;Username=masryvoice;Password=masryvoice_ci_pass"
          Security__AdminKey: "masryvoice_ci_admin_key_2026"
          Security__HmacSecret: "masryvoice_ci_customer_hmac_secret_2026"
          LlmProvider: "DeterministicFake"
          RateLimiting__ApiPermitLimit: "300"
        run: |
          dotnet run --project backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-build &
          echo "Waiting for API readiness at http://localhost:5000/api/health/ready..."
          READY=0
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:5000/api/health/ready || true)
            if [ "$HTTP_CODE" = "200" ] && grep -q '"status":"Ready"' /tmp/ready.json; then
              echo "MasryVoice API is ready (HTTP 200)!"
              cat /tmp/ready.json
              READY=1
              break
            fi
            echo "Waiting for readiness (HTTP $HTTP_CODE) ($i/30)..."
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "MasryVoice API failed to reach readiness!"
            exit 1
          fi

          echo "Checking liveness at http://localhost:5000/api/health/live..."
          curl -s -f http://localhost:5000/api/health/live | grep -q "Alive"

      - name: Run Postman Acceptance Test Collection (Run 1)
        run: |
          mkdir -p tests/postman/reports
          postman collection run tests/postman/MasryVoice.postman_collection.json \
            -e tests/postman/MasryVoice.postman_environment.json \
            --env-var "adminKey=masryvoice_ci_admin_key_2026" \
            -r cli,json \
            --reporter-json-export tests/postman/reports/postman-acceptance-run1.json

      - name: Validate Postman Acceptance Report (Run 1)
        run: |
          REPORT="tests/postman/reports/postman-acceptance-run1.json"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: Postman acceptance report not found at $REPORT!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("'$REPORT'", "utf8"));
            const summary = data.run?.summary;
            if (!summary) {
              console.error("ERROR: Malformed Postman report JSON: summary missing");
              process.exit(1);
            }
            const executed = summary.tests?.executed || 0;
            const failed = summary.tests?.failed || 0;
            console.log(`Postman Run 1 executed assertions: ${executed}, failed assertions: ${failed}`);
            if (executed === 0) {
              console.error("ERROR: Zero test assertions were executed in Postman run 1!");
              process.exit(1);
            }
            if (failed > 0) {
              console.error(`ERROR: ${failed} Postman assertions failed in run 1!`);
              process.exit(1);
            }
            console.log("Postman Run 1 acceptance assertions verified successfully!");
          '

      - name: Run Postman Acceptance Test Collection (Run 2 - Re-verification against same isolated database)
        run: |
          postman collection run tests/postman/MasryVoice.postman_collection.json \
            -e tests/postman/MasryVoice.postman_environment.json \
            --env-var "adminKey=masryvoice_ci_admin_key_2026" \
            -r cli,json \
            --reporter-json-export tests/postman/reports/postman-acceptance-run2.json

      - name: Validate Postman Acceptance Report (Run 2)
        run: |
          REPORT="tests/postman/reports/postman-acceptance-run2.json"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: Postman acceptance report not found at $REPORT!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("'$REPORT'", "utf8"));
            const summary = data.run?.summary;
            if (!summary) {
              console.error("ERROR: Malformed Postman report JSON: summary missing");
              process.exit(1);
            }
            const executed = summary.tests?.executed || 0;
            const failed = summary.tests?.failed || 0;
            console.log(`Postman Run 2 executed assertions: ${executed}, failed assertions: ${failed}`);
            if (executed === 0) {
              console.error("ERROR: Zero test assertions were executed in Postman run 2!");
              process.exit(1);
            }
            if (failed > 0) {
              console.error(`ERROR: ${failed} Postman assertions failed in run 2!`);
              process.exit(1);
            }
            console.log("Postman Run 2 acceptance assertions verified successfully!");
          '

      - name: Sanitize and Scan Artifact Confidentiality
        if: always()
        run: |
          if [ -f "tests/postman/reports/postman-acceptance-run1.json" ]; then
            node tests/postman/sanitize-report.js tests/postman/reports/postman-acceptance-run1.json
          fi
          if [ -f "tests/postman/reports/postman-acceptance-run2.json" ]; then
            node tests/postman/sanitize-report.js tests/postman/reports/postman-acceptance-run2.json
          fi

      - name: Upload Postman Acceptance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-acceptance-reports
          path: |
            tests/postman/reports/postman-acceptance-run1.json
            tests/postman/reports/postman-acceptance-run2.json
          retention-days: 3
          if-no-files-found: error

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: frontend
        run: npm run build

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - backend-build-test
      - postgres-integration-test
      - api-acceptance-test
      - frontend-build
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate All Required CI Statuses
        run: |
          echo "=== CI Checks Summary ==="
          echo "Backend Build & Unit Tests:        ${{ needs.backend-build-test.result }}"
          echo "PostgreSQL & pgvector Integration: ${{ needs.postgres-integration-test.result }}"
          echo "Postman CLI API Acceptance:        ${{ needs.api-acceptance-test.result }}"
          echo "Frontend TypeScript & Build:       ${{ needs.frontend-build.result }}"

          if [ "${{ needs.backend-build-test.result }}" != "success" ] || \
             [ "${{ needs.postgres-integration-test.result }}" != "success" ] || \
             [ "${{ needs.api-acceptance-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "ERROR: One or more required CI jobs did not succeed. Failing CI Gate."
            exit 1
          fi

          echo "SUCCESS: All required CI jobs completed successfully. Gate Passed!"
