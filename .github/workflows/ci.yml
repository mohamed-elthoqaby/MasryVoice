name: MasryVoice CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build-test:
    name: Backend Build & Deterministic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend & Tests
        run: |
          dotnet restore backend/MasryVoice.Api/MasryVoice.Api.csproj
          dotnet restore tests/MasryVoice.Tests/MasryVoice.Tests.csproj

      - name: Build Solution (Release)
        run: |
          dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-restore
          dotnet build tests/MasryVoice.Tests/MasryVoice.Tests.csproj -c Release --no-restore

      - name: Run Deterministic Domain & Rule Tests
        run: |
          dotnet test tests/MasryVoice.Tests/MasryVoice.Tests.csproj \
            -c Release --no-build \
            --filter "Category!=ExternalModel&Category!=PostgresIntegration" \
            --logger "console;verbosity=normal"

      - name: Setup Python for Voice Server Unit Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Voice Unit Dependencies (Headless / No Weights)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic uvicorn starlette av python-multipart

      - name: Run Voice Server Lifecycle Unit Tests
        run: python -m unittest tests/test_voice_server_lifecycle.py tests/test_verification_script_logic.py

  postgres-integration-test:
    name: PostgreSQL & pgvector Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masryvoice
          POSTGRES_PASSWORD: masryvoice_ci_pass
          POSTGRES_DB: masryvoice_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masryvoice -d masryvoice_ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build Tests
        run: |
          dotnet restore tests/MasryVoice.Tests/MasryVoice.Tests.csproj
          dotnet build tests/MasryVoice.Tests/MasryVoice.Tests.csproj -c Release

      - name: Run PostgreSQL Migration, Capacity & Concurrency Integration Tests
        env:
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_ci_db;Username=masryvoice;Password=masryvoice_ci_pass"
        run: |
          dotnet test tests/MasryVoice.Tests/MasryVoice.Tests.csproj \
            -c Release --no-build \
            --filter "Category=PostgresIntegration|FullyQualifiedName~SchemaMigrationAcceptanceTests" \
            --logger "console;verbosity=normal"

  api-acceptance-test:
    name: Postman CLI API Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masryvoice
          POSTGRES_PASSWORD: masryvoice_ci_pass
          POSTGRES_DB: masryvoice_acceptance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masryvoice -d masryvoice_acceptance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
          postman --version

      - name: Build Backend API (Release)
        run: |
          dotnet restore backend/MasryVoice.Api/MasryVoice.Api.csproj
          dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-restore

      - name: Verify Production Startup Integrity & Fixtures Disabling
        env:
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_acceptance_db;Username=masryvoice;Password=masryvoice_ci_pass"
        run: |
          echo "=== 1. Testing Production Startup Rejection with Invalid Secrets ==="
          PROD_FAIL=0
          ASPNETCORE_ENVIRONMENT=Production Security__AdminKey="short" Security__HmacSecret="short" \
            dotnet backend/MasryVoice.Api/bin/Release/net10.0/MasryVoice.Api.dll || PROD_FAIL=1
          if [ "$PROD_FAIL" -ne 1 ]; then
            echo "ERROR: Production startup succeeded with invalid secrets! Secret validation failed."
            exit 1
          fi
          echo "Production startup correctly rejected placeholder/short secrets."

          echo "=== 2. Testing Production Startup with Valid Secrets ==="
          ASPNETCORE_ENVIRONMENT=Production \
          Security__AdminKey="masryvoice_prod_admin_key_2026" \
          Security__HmacSecret="masryvoice_prod_customer_hmac_secret_2026" \
          LlmProvider="DeterministicFake" \
          dotnet backend/MasryVoice.Api/bin/Release/net10.0/MasryVoice.Api.dll --urls http://localhost:5001 &
          PROD_PID=$!

          PROD_READY=0
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /tmp/prod_ready.json -w "%{http_code}" http://localhost:5001/api/health/ready || true)
            if [ "$HTTP_CODE" = "200" ] && grep -q '"status":"Ready"' /tmp/prod_ready.json; then
              PROD_ENV=$(grep -o '"environment":"[^"]*"' /tmp/prod_ready.json | cut -d'"' -f4)
              if [ "$PROD_ENV" != "Production" ]; then
                echo "ERROR: Runtime environment mismatch! Expected 'Production', got '$PROD_ENV'!"
                kill $PROD_PID || true
                exit 1
              fi
              echo "Production instance ready and verified with environment: Production!"
              PROD_READY=1
              break
            fi
            sleep 1
          done
          if [ "$PROD_READY" -ne 1 ]; then
            echo "ERROR: Production instance failed to reach readiness!"
            kill $PROD_PID || true
            exit 1
          fi

          echo "=== 3. Testing /api/admin/fixtures Disabled (404 Not Found) in Production ==="
          FIXTURES_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "X-Admin-Key: masryvoice_prod_admin_key_2026" \
            "http://localhost:5001/api/admin/fixtures?conversationIds=00000000-0000-0000-0000-000000000000")
          echo "/api/admin/fixtures in Production returned HTTP $FIXTURES_CODE"
          if [ "$FIXTURES_CODE" != "404" ]; then
            echo "ERROR: /api/admin/fixtures did not return 404 in Production! Got HTTP $FIXTURES_CODE."
            kill $PROD_PID || true
            exit 1
          fi
          echo "Verified /api/admin/fixtures safely returns 404 in Production."
          kill $PROD_PID || true
          wait $PROD_PID 2>/dev/null || true

      - name: Start MasryVoice API in Background (Testing Environment)
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_acceptance_db;Username=masryvoice;Password=masryvoice_ci_pass"
          Security__AdminKey: "masryvoice_ci_admin_key_2026"
          Security__HmacSecret: "masryvoice_ci_customer_hmac_secret_2026"
          LlmProvider: "DeterministicFake"
          RateLimiting__ApiPermitLimit: "300"
        run: |
          dotnet backend/MasryVoice.Api/bin/Release/net10.0/MasryVoice.Api.dll --urls http://localhost:5000 &
          echo "Waiting for API readiness at http://localhost:5000/api/health/ready..."
          READY=0
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:5000/api/health/ready || true)
            if [ "$HTTP_CODE" = "200" ] && grep -q '"status":"Ready"' /tmp/ready.json; then
              ENV_NAME=$(grep -o '"environment":"[^"]*"' /tmp/ready.json | cut -d'"' -f4)
              if [ "$ENV_NAME" != "Testing" ]; then
                echo "ERROR: Runtime environment mismatch! Expected 'Testing', got '$ENV_NAME'!"
                exit 1
              fi
              echo "MasryVoice API is ready in verified Testing environment (HTTP 200)!"
              cat /tmp/ready.json
              READY=1
              break
            fi
            echo "Waiting for readiness (HTTP $HTTP_CODE) ($i/30)..."
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "MasryVoice API failed to reach readiness!"
            exit 1
          fi

          echo "Checking liveness at http://localhost:5000/api/health/live..."
          curl -s -f http://localhost:5000/api/health/live | grep -q "Alive"

      - name: Run Postman Acceptance Test Collection (Run 1)
        run: |
          mkdir -p tests/postman/reports
          postman collection run tests/postman/MasryVoice.postman_collection.json \
            -e tests/postman/MasryVoice.postman_environment.json \
            --env-var "adminKey=masryvoice_ci_admin_key_2026" \
            -r cli,json \
            --reporter-json-export tests/postman/reports/postman-acceptance-run1.json

      - name: Validate Postman Acceptance Report (Run 1)
        run: |
          REPORT="tests/postman/reports/postman-acceptance-run1.json"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: Postman acceptance report not found at $REPORT!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("'$REPORT'", "utf8"));
            const summary = data.run?.summary;
            if (!summary) {
              console.error("ERROR: Malformed Postman report JSON: summary missing");
              process.exit(1);
            }
            const executed = summary.tests?.executed || 0;
            const failed = summary.tests?.failed || 0;
            console.log(`Postman Run 1 executed assertions: ${executed}, failed assertions: ${failed}`);
            if (executed === 0) {
              console.error("ERROR: Zero test assertions were executed in Postman run 1!");
              process.exit(1);
            }
            if (failed > 0) {
              console.error(`ERROR: ${failed} Postman assertions failed in run 1!`);
              process.exit(1);
            }
            console.log("Postman Run 1 acceptance assertions verified successfully!");
          '

      - name: Run Postman Acceptance Test Collection (Run 2 - Re-verification against same isolated database)
        run: |
          postman collection run tests/postman/MasryVoice.postman_collection.json \
            -e tests/postman/MasryVoice.postman_environment.json \
            --env-var "adminKey=masryvoice_ci_admin_key_2026" \
            -r cli,json \
            --reporter-json-export tests/postman/reports/postman-acceptance-run2.json

      - name: Validate Postman Acceptance Report (Run 2)
        run: |
          REPORT="tests/postman/reports/postman-acceptance-run2.json"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: Postman acceptance report not found at $REPORT!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("'$REPORT'", "utf8"));
            const summary = data.run?.summary;
            if (!summary) {
              console.error("ERROR: Malformed Postman report JSON: summary missing");
              process.exit(1);
            }
            const executed = summary.tests?.executed || 0;
            const failed = summary.tests?.failed || 0;
            console.log(`Postman Run 2 executed assertions: ${executed}, failed assertions: ${failed}`);
            if (executed === 0) {
              console.error("ERROR: Zero test assertions were executed in Postman run 2!");
              process.exit(1);
            }
            if (failed > 0) {
              console.error(`ERROR: ${failed} Postman assertions failed in run 2!`);
              process.exit(1);
            }
            console.log("Postman Run 2 acceptance assertions verified successfully!");
          '

      - name: Run Sanitizer Regression Test Suite
        run: node tests/postman/sanitize-report.test.js

      - name: Sanitize and Scan Artifact Confidentiality
        run: |
          mkdir -p tests/postman/reports/sanitized
          if [ -f "tests/postman/reports/postman-acceptance-run1.json" ]; then
            node tests/postman/sanitize-report.js tests/postman/reports/postman-acceptance-run1.json tests/postman/reports/sanitized/postman-acceptance-run1.json
          fi
          if [ -f "tests/postman/reports/postman-acceptance-run2.json" ]; then
            node tests/postman/sanitize-report.js tests/postman/reports/postman-acceptance-run2.json tests/postman/reports/sanitized/postman-acceptance-run2.json
          fi

      - name: Inspect Sanitized Artifacts Independently
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "tests/postman/reports/sanitized/postman-acceptance-run1.json",
              "tests/postman/reports/sanitized/postman-acceptance-run2.json"
            ];
            for (const file of files) {
              if (!fs.existsSync(file)) {
                console.error(`ERROR: Sanitized report missing at ${file}`);
                process.exit(1);
              }
              const content = fs.readFileSync(file, "utf8");
              if (content.includes("masryvoice_ci_admin_key_2026") || content.includes("masryvoice_ci_customer_hmac_secret_2026")) {
                console.error(`ERROR: Raw CI secrets detected in ${file}!`);
                process.exit(1);
              }
              const data = JSON.parse(content);
              const summary = data.run?.summary;
              if (!summary || (summary.tests?.executed || 0) === 0 || (summary.tests?.failed || 0) > 0) {
                console.error(`ERROR: Invalid test assertions in sanitized artifact ${file}!`);
                process.exit(1);
              }
              console.log(`Verified ${file}: ${summary.tests.executed} passed assertions, 0 leaks.`);
            }
          '

      - name: Upload Sanitized Postman Acceptance Reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postman-acceptance-reports
          path: |
            tests/postman/reports/sanitized/postman-acceptance-run1.json
            tests/postman/reports/sanitized/postman-acceptance-run2.json
          retention-days: 3
          if-no-files-found: error

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: frontend
        run: npm run build

  browser-smoke-test:
    name: Browser UI Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        working-directory: frontend
        run: |
          node ./node_modules/playwright-core/cli.js --version
          node ./node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Build Backend (Release)
        run: dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Start MasryVoice Backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: "http://localhost:5000"
          Database__InitializeSchema: "true"
          Database__AutoSeed: "true"
          Security__AdminKey: "masryvoice_dev_admin_key"
          Security__HmacSecret: "masryvoice_dev_hmac_secret_key_12345"
          LlmProvider: "DeterministicFake"
          Voice__SttProvider: "Simulated"
          Voice__TtsProvider: "Simulated"
          RateLimiting__ApiPermitLimit: "500"
        run: |
          dotnet backend/MasryVoice.Api/bin/Release/net10.0/MasryVoice.Api.dll --urls http://localhost:5000 &
          echo "Waiting for API readiness at http://localhost:5000/api/health/ready..."
          READY=0
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /tmp/browser_ready.json -w "%{http_code}" http://localhost:5000/api/health/ready || true)
            if [ "$HTTP_CODE" = "200" ] && grep -q '"status":"Ready"' /tmp/browser_ready.json; then
              ENV_NAME=$(grep -o '"environment":"[^"]*"' /tmp/browser_ready.json | cut -d'"' -f4)
              if [ "$ENV_NAME" != "Testing" ]; then
                echo "ERROR: Runtime environment mismatch! Expected 'Testing', got '$ENV_NAME'!"
                exit 1
              fi
              echo "Backend ready in verified Testing environment!"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Backend failed to become ready!"
            exit 1
          fi

      - name: Start Frontend Server
        working-directory: frontend
        run: |
          npm run start &
          echo "Waiting for frontend readiness at http://localhost:3000..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "Frontend ready!"
              break
            fi
            sleep 1
          done

      - name: Run Browser Smoke Suite (Playwright)
        env:
          FRONTEND_URL: "http://localhost:3000"
          ADMIN_KEY: "masryvoice_dev_admin_key"
        run: node tests/browser/smoke.test.js

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - backend-build-test
      - postgres-integration-test
      - api-acceptance-test
      - frontend-build
      - browser-smoke-test
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate All Required CI Statuses
        run: |
          echo "=== CI Checks Summary ==="
          echo "Backend Build & Unit Tests:        ${{ needs.backend-build-test.result }}"
          echo "PostgreSQL & pgvector Integration: ${{ needs.postgres-integration-test.result }}"
          echo "Postman CLI API Acceptance:        ${{ needs.api-acceptance-test.result }}"
          echo "Frontend TypeScript & Build:       ${{ needs.frontend-build.result }}"
          echo "Browser UI Smoke Tests:            ${{ needs.browser-smoke-test.result }}"

          if [ "${{ needs.backend-build-test.result }}" != "success" ] || \
             [ "${{ needs.postgres-integration-test.result }}" != "success" ] || \
             [ "${{ needs.api-acceptance-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.browser-smoke-test.result }}" != "success" ]; then
            echo "ERROR: One or more required CI jobs did not succeed. Failing CI Gate."
            exit 1
          fi

          echo "SUCCESS: All required CI jobs completed successfully. Gate Passed!"
