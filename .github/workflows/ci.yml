name: MasryVoice CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build-test:
    name: Backend Build & Deterministic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend & Tests
        run: |
          dotnet restore backend/MasryVoice.Api/MasryVoice.Api.csproj
          dotnet restore tests/MasryVoice.Tests/MasryVoice.Tests.csproj

      - name: Build Solution (Release)
        run: |
          dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-restore
          dotnet build tests/MasryVoice.Tests/MasryVoice.Tests.csproj -c Release --no-restore

      - name: Run Deterministic Domain & Rule Tests
        run: |
          dotnet test tests/MasryVoice.Tests/MasryVoice.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~VerticalSliceTests|FullyQualifiedName~ProductionFeatureTests|FullyQualifiedName~BackendPerformanceAndLoadTests" \
            --logger "console;verbosity=normal"

  postgres-integration-test:
    name: PostgreSQL & pgvector Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masryvoice
          POSTGRES_PASSWORD: masryvoice_ci_pass
          POSTGRES_DB: masryvoice_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masryvoice -d masryvoice_ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build Tests
        run: |
          dotnet restore tests/MasryVoice.Tests/MasryVoice.Tests.csproj
          dotnet build tests/MasryVoice.Tests/MasryVoice.Tests.csproj -c Release

      - name: Run PostgreSQL Capacity & Concurrency Integration Tests
        env:
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_ci_db;Username=masryvoice;Password=masryvoice_ci_pass"
        run: |
          dotnet test tests/MasryVoice.Tests/MasryVoice.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~PostgresCapacityIntegrationTests" \
            --logger "console;verbosity=normal"

  api-acceptance-test:
    name: Postman CLI API Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masryvoice
          POSTGRES_PASSWORD: masryvoice_ci_pass
          POSTGRES_DB: masryvoice_acceptance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masryvoice -d masryvoice_acceptance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Postman CLI & Acceptance Test Tools
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh || true
          if command -v postman &> /dev/null; then
            postman --version || true
          fi
          npm install -g newman
          newman --version

      - name: Build Backend API (Release)
        run: |
          dotnet restore backend/MasryVoice.Api/MasryVoice.Api.csproj
          dotnet build backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-restore

      - name: Start MasryVoice API in Background
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DatabaseProvider: PostgreSql
          ConnectionStrings__PostgreSql: "Host=localhost;Port=5432;Database=masryvoice_acceptance_db;Username=masryvoice;Password=masryvoice_ci_pass"
          Security__AdminKey: "masryvoice_ci_admin_key_2026"
          Security__HmacSecret: "masryvoice_ci_customer_hmac_secret_2026"
          LlmProvider: "DeterministicFake"
        run: |
          dotnet run --project backend/MasryVoice.Api/MasryVoice.Api.csproj -c Release --no-build &
          echo "Waiting for API to respond at http://localhost:5000/api/health..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/api/health | grep -q "Healthy"; then
              echo "MasryVoice API is up and healthy!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 1
          done

      - name: Run Postman Acceptance Test Collection
        run: |
          mkdir -p tests/postman/reports
          if command -v postman &> /dev/null && postman collection run tests/postman/MasryVoice.postman_collection.json -e tests/postman/MasryVoice.postman_environment.json --env-var "adminKey=masryvoice_ci_admin_key_2026" -r cli,json --reporter-json-export tests/postman/reports/postman-acceptance.json; then
            echo "Postman CLI run succeeded!"
          else
            echo "Running collection via Newman..."
            newman run tests/postman/MasryVoice.postman_collection.json \
              -e tests/postman/MasryVoice.postman_environment.json \
              --env-var "adminKey=masryvoice_ci_admin_key_2026" \
              -r cli,json \
              --reporter-json-export tests/postman/reports/postman-acceptance.json
          fi

      - name: Upload Postman Acceptance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-acceptance-report
          path: tests/postman/reports/postman-acceptance.json
          retention-days: 3

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: frontend
        run: npm run build

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - backend-build-test
      - postgres-integration-test
      - api-acceptance-test
      - frontend-build
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate All Required CI Statuses
        run: |
          echo "=== CI Checks Summary ==="
          echo "Backend Build & Unit Tests:        ${{ needs.backend-build-test.result }}"
          echo "PostgreSQL & pgvector Integration: ${{ needs.postgres-integration-test.result }}"
          echo "Postman CLI API Acceptance:        ${{ needs.api-acceptance-test.result }}"
          echo "Frontend TypeScript & Build:       ${{ needs.frontend-build.result }}"

          if [ "${{ needs.backend-build-test.result }}" != "success" ] || \
             [ "${{ needs.postgres-integration-test.result }}" != "success" ] || \
             [ "${{ needs.api-acceptance-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "ERROR: One or more required CI jobs did not succeed. Failing CI Gate."
            exit 1
          fi

          echo "SUCCESS: All required CI jobs completed successfully. Gate Passed!"
